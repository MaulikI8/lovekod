name: Deploy LoveKod to Nest Nepal

on:
  push:
    branches:
      - main
      - redesign/premium-finish

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production Frontend
        run: npm run build

      - name: Deploy Frontend to Nest Nepal (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: lovekod.com/
          dangerous-clean-slate: false

      - name: Deploy Backend to Nest Nepal (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: backend/
          exclude: |
            **/.git*
            **/.git*/**
            **/__pycache__/**
            **/*.sqlite3
            **/*.pyc
          dangerous-clean-slate: false
