{% load admin_list %}

{% if actions_on_top %}
    {% if cl.search_fields or action_form or cl.has_filters %}
        <div class="bottom-4 end-6 hidden group-has-[input.action-select:checked]:flex fixed gap-3 items-center z-50 transition-all pointer-events-auto" style="left: 280px; max-width: calc(100vw - 320px);">
            <div id="changelist-actions-wrapper" class="grow group changelist-actions shadow-2xl rounded-2xl overflow-hidden">
                {% if action_form %}
                    {% admin_actions %}
                {% endif %}
            </div>
        </div>
    {% endif %}
{% endif %}
