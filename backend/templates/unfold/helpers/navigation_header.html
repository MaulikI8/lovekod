{% load unfold static %}

<div class="border-b border-gray-100 flex gap-3 items-center h-[64px] mb-3 dark:border-base-800 px-4">
    <a href="{% url 'admin:index' %}" class="flex items-center gap-3 grow min-w-0 py-1.5 rounded-xl transition-colors text-decoration-none">
        <!-- Circular LoveKod Logo Avatar (Matches Canva Design) -->
        <div class="w-9 h-9 rounded-full overflow-hidden flex-shrink-0 bg-[#fbf6f0] border border-amber-200/60 flex items-center justify-center shadow-xs">
            <img src="/static/images/logo.jpg" alt="LoveKod" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'text-xs font-serif font-bold text-amber-800\'>lk</span>';" />
        </div>

        <!-- Clean Lowercase Store Name (Matches Canva Design) -->
        <span class="text-base font-bold text-gray-900 dark:text-white tracking-tight lowercase">
            lovekod
        </span>
    </a>

    <!-- Mobile sidebar close toggle -->
    <span class="material-symbols-outlined block cursor-pointer h-[18px] xl:hidden! hover:text-base-700 dark:hover:text-base-200 text-gray-400" x-on:click="sidebarToggle()">
        close
    </span>
</div>
